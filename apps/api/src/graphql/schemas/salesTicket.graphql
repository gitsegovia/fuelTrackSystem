enum SalesTicketStatus {
  ISSUED
  PAID
  DISPATCHED
  COMPLETED
  CANCELED
}

enum PaymentMode {
  PREPAID
  POSTPAID
}

type SalesTicket {
  id: UUID!
  gasStationId: UUID!
  ticketNumber: Int!
  cashierShiftId: UUID!
  dispatcherEmployeeId: UUID
  dispatcherShiftId: UUID
  dispenserNozzleId: UUID
  fuelTypeId: UUID!
  requestedLiters: Decimal!
  actualLitersDispatched: Decimal
  assignedSaleTypeConfigId: UUID!
  ticketIssueTime: DateTime!
  paymentMode: PaymentMode!
  pricePerLiter: Decimal!
  totalAmountExpected: Decimal!
  status: SalesTicketStatus!
  createdAt: DateTime!
  updatedAt: DateTime!
  gasStation: GasStation!
  cashierShift: EmployeeShift!
  dispatcherEmployee: Employee
  dispatcherShift: EmployeeShift
  dispenserNozzle: DispenserNozzle
  fuelType: FuelType!
  assignedSaleTypeConfig: SaleTypeConfig!
  payments: [Payment!]!
}

# Diferencial a favor de la estación de un ticket: pagado − despachado − devuelto (D-18).
# Montos en moneda base (monto / exchangeRate). Solo es significativo en COMPLETED.
type SalesTicketDifferential {
  paidAmount: Decimal!
  dispatchedAmount: Decimal!
  refundedAmount: Decimal!
  differentialAmount: Decimal!
  differentialLiters: Decimal!
}

# Totales por bombero para el cierre de turno. Solo tickets COMPLETED. Sin comisiones (D-17).
type DispatcherDifferentialSummary {
  dispatcherEmployeeId: UUID!
  ticketCount: Int!
  grossDifferentialLiters: Decimal!
  grossDifferentialAmount: Decimal!
  refundedLiters: Decimal!
  refundedAmount: Decimal!
  netDifferentialLiters: Decimal!
  netDifferentialAmount: Decimal!
}

input CreateSalesTicketInput {
  gasStationId: UUID!
  cashierShiftId: UUID!
  fuelTypeId: UUID!
  requestedLiters: Decimal!
  assignedSaleTypeConfigId: UUID!
  ticketIssueTime: DateTime!
  paymentMode: PaymentMode # Default: PREPAID
}

# El total, el precio y el estado no son editables: los calcula el servidor y los cambian las
# mutations de cobro y despacho. Cambiar litros, tipo de venta o combustible solo se permite
# mientras el ticket está en ISSUED y recalcula el total.
input UpdateSalesTicketInput {
  fuelTypeId: UUID
  requestedLiters: Decimal
  assignedSaleTypeConfigId: UUID
  ticketIssueTime: DateTime
}

extend type Query {
  salesTickets: [SalesTicket!]!
  salesTicket(id: UUID!): SalesTicket
  salesTicketsByGasStation(gasStationId: UUID!, date: DateTime, startDate: DateTime, endDate: DateTime): [SalesTicket!]!
  salesTicketsByCashierShift(cashierShiftId: UUID!): [SalesTicket!]!
  salesTicketsByDispatcher(dispatcherEmployeeId: UUID!): [SalesTicket!]!
  salesTicketsByNozzle(dispenserNozzleId: UUID!): [SalesTicket!]!
  salesTicketsByFuelType(fuelTypeId: UUID!): [SalesTicket!]!
  salesTicketsByStatus(status: SalesTicketStatus!): [SalesTicket!]!
  salesTicketDailyTotals(gasStationId: UUID, startDate: DateTime!, endDate: DateTime!): [SalesTicketDailyTotal!]!
  salesTicketDifferential(id: UUID!): SalesTicketDifferential
  # Por estación y rango de emisión, o por turno del bombero (dispatcherShiftId).
  dispatcherDifferentialSummary(
    gasStationId: UUID
    startDate: DateTime
    endDate: DateTime
    dispatcherShiftId: UUID
  ): [DispatcherDifferentialSummary!]!
}

type SalesTicketDailyTotal {
  date: Date!
  fuelTypeId: UUID!
  fuelTypeName: String!
  liters: Decimal!
  revenue: Decimal!
  ticketCount: Int!
}

extend type Mutation {
  createSalesTicket(input: CreateSalesTicketInput!): SalesTicket!
  updateSalesTicket(id: UUID!, input: UpdateSalesTicketInput!): SalesTicket
  deleteSalesTicket(id: UUID!): Boolean!
  # PREPAID: solo desde PAID; litros ≤ requestedLiters. COMPLETED.
  # POSTPAID: solo desde ISSUED; recalcula el total con el precio actual. DISPATCHED.
  processSalesTicketDispatch(id: UUID!, dispatcherEmployeeId: UUID!, dispenserNozzleId: UUID!, actualLitersDispatched: Decimal!): SalesTicket!
  # Obsoleta: COMPLETED ocurre solo al cumplirse cobro y despacho según el modo.
  completeSalesTicketPayment(id: UUID!): SalesTicket! @deprecated(reason: "COMPLETED ocurre automáticamente al cumplirse pago y despacho según paymentMode")
  cancelSalesTicket(id: UUID!): SalesTicket!
}
